project_name: "BMW_Optuna_Tuning"
seed: 42

data:
  raw_dir: "data/raw"
  manifest_path: "data/manifest.csv"
  sample_rate: 44100
  duration: 5.0
  batch_size: 32  # Will be tuned
  num_workers: 4
  train_split: 0.8
  val_split: 0.2

audio:
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  fmin: 20
  fmax: 16000

model:
  name: "resnet18"
  pretrained: true
  num_classes: 5

training:
  epochs: 15  # Fewer epochs for tuning
  learning_rate: 0.001  # Will be tuned
  checkpoint_dir: "experiments/tuning"
