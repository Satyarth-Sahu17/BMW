experiment:
  name: "fast_cpu_training"
  description: "Fast training config for CPU-only machine"
  seed: 42

data:
  manifest_train: "data/manifest_train.csv"
  manifest_val: "data/manifest_val.csv"
  manifest_test: "data/manifest_test.csv"
  audio_dir: "data/raw"
  sample_rate: 44100  
  duration: 30
  window_size: 1.5
  hop_size: 0.75
  classes:
    - wolf
    - snow_leopard
    - tiger
    - gunshot
    - chainsaw
    - background

preprocessing:
  normalize: true
  remove_silence: true
  silence_threshold: -40
  noise_reduction: false

features:
  type: "mel_spectrogram"
  n_mels: 128    
  n_fft: 1024      
  hop_length: 256   
  spectrogram_size: [224 , 224]   

augmentation:
  enabled: false    
  time_shift: 0.0
  pitch_shift: 0
  noise_injection: 0.0
  spec_augment: false

model:
  framework: "pytorch"
  type: "transfer_learning"
  pretrained_model: "mobilenet_v2"   # MUCH faster on CPU
  dropout: 0.3
  l2_regularization: 0.0001

training:
  epochs: 20             # ↓ from 100
  batch_size: 8          # small batches for CPU
  learning_rate: 0.001
  optimizer: "adam"
  loss: "focal_loss"
  focal_loss_alpha: 0.25
  focal_loss_gamma: 2.0
  class_weights: null

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - balanced_accuracy
  confusion_matrix: true
  per_class_analysis: true

output:
  model_dir: "models"
  experiment_dir: "experiments"
  tensorboard_dir: "logs/tensorboard"
  log_file: "logs/training.log"
